# Table III displays its rounded value 3.55e13 Hz^2.
l = 44.0 # rad^2 Hz km^-1
fc1_hz = 100.0 # Hz
s0 = 1e-8 # rad^2 Hz^-1
fc2_hz = 200e3 # Hz
