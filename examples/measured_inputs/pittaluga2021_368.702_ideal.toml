# Conditional phase-bracket example; no Bertaina apparatus coefficients.
# phase: rad and seconds; line: km and COMPLETE dB; detector: fractions and Hz; quantum clock: Hz.
# Pittaluga Tables I–III; NoteVI asymptotic normalization; pattern25040 at1GHz; numerical CAL truncation from QKD.ipynb Cell23
# Explicit phase bracket, not a measured quantum-channel RMS at this length/window. User-adopted nondecreasing residual RMS with length; effective quantum clock already accounts for reference slots, no additional downtime.
# Ideal edet and unreported fEC are explicitly flagged by the measured-phase resolver.

[phase]
mode = "measured"
sigma_phi_rad = 0.0
